events { worker_connections 1024; }

http {
    # Route traffic for app1.local to the app1 container
    # It tells Nginx to treat everything inside the curly braces as a unique configuration    profile for a specific website or service on your server.

    # What it does: Tells Nginx to listen for incoming web requests on Port 80.
    # Why it matters: Port 80 is the global standard port for unencrypted (HTTP) web traffic. Every time someone types a standard http:// URL into their browser, it hits this port.
    server { 
        listen 80;
        server_name app1.local;

        location / {
            proxy_pass http://app1:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # Route traffic for app2.local to the app2 container
    server {
        listen 80;
        server_name app2.local;

        location / {
            proxy_pass http://app2:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    server {
        listen 80;
        server_name app3.local;

        location / {
            proxy_pass http://app3:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }


}
