version: '3.8'

networks:
  proxy-network:
    driver: bridge


services:
  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-gateway
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - proxy-network
    depends_on:
      - app1
      - app2
      - app3


  app1:
    build:
      context: ./app1
      dockerfile: Dockerfile
    container_name: app1-container
    networks:
      - proxy-network
    restart: always


  app2:
    build:
      context: ./app2
      dockerfile: Dockerfile
    container_name: app2-container
    networks:
      - proxy-network
    restart: always


  app3:
    build:
      context: ./app3
      dockerfile: Dockerfile
    container_name: app3-container
    networks:
      - proxy-network
    restart: always
